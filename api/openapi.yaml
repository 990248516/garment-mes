    get:
      tags: [Bundles]
      operationId: resolveQrToken
      summary: 解析二维码 Token 并进入工人端
      description: 服务端仅保存 Token 的 SHA-256；不得在日志中记录完整 Token。
      security: []
      x-rate-limit: 60/minute/IP
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 20, maxLength: 128 }
      responses:
        '302':
          description: 重定向到登录或扎包页面
          headers:
            Location:
              schema: { type: string, format: uri-reference }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Token 已吊销或扎包已作废
          content:
