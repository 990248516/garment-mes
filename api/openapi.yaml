openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 云裁 MES / WIP API
  version: 1.0.0
  summary: 服装制造“一扎一码”生产管理接口契约
  description: |
    面向管理后台、工人扫码端、打印服务和外部集成的 REST API。

    核心约束：
    - 所有工厂业务请求必须携带 `X-Factory-Id`，服务端同时执行 RBAC 与数据范围校验。
    - 所有写请求必须携带 `Idempotency-Key`；相同键和相同请求体返回首次结果，相同键但不同请求体返回 `409 IDEMPOTENCY_KEY_REUSED`。
    - 生产事实时间以服务器时间为准，客户端时间仅用于弱网和离线审计。
    - 完工数量必须满足 `inputQty = goodQty + defectQty + missingQty`。
    - 完工、步骤更新、下一步骤解锁、计件快照、事件和审计在同一事务内提交。
    - 已完成生产事实不可覆盖；更正、返工和计件调整均以追加记录实现。
    - 金额以十进制定点字符串传输，禁止使用 IEEE 754 浮点数。
  contact:
    name: MES Product & Engineering
  license:
    name: Proprietary
servers:
  - url: https://mes.example.com
    description: 生产环境示例
  - url: http://127.0.0.1:3000
    description: 本地开发
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 登录、令牌与当前用户
  - name: Organization
    description: 组织、工厂、车间和生产线
  - name: Access Control
    description: 用户、角色与数据权限
  - name: Workers
    description: 工人与多工种技能
  - name: Master Data
    description: 客户、款式、颜色、尺码和工序
  - name: Routes
    description: 款式工艺路线及版本发布
  - name: Orders
    description: 生产订单及颜色尺码明细
  - name: Cutting
    description: 裁床床次
  - name: Bundles
    description: 扎包、二维码、数量调整与追溯
  - name: Printing
    description: 卡片打印与补打
  - name: Work Reports
    description: 开工、完工、取消和更正
  - name: Quality
    description: 异常、缺陷、返工、放行与报废
  - name: Piecework
    description: 单价、计件事实、确认和结算
  - name: Dashboards
    description: 生产进度、WIP、预警和个人统计
  - name: Imports & Exports
    description: 批量导入、导出与异步任务
  - name: Audit
    description: 审计日志与敏感操作追踪
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 工号/用户名与 PIN/密码登录
      security: []
      x-rate-limit: 10/minute/IP+account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: 账号已锁定或停用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: 刷新访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 20 }
      responses:
        '200':
          description: 刷新成功并轮换刷新令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 注销当前会话
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已注销 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 获取当前用户、角色和可访问工厂
      responses:
        '200':
          description: 当前身份上下文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/organizations:
    get:
      tags: [Organization]
      operationId: listOrganizations
      summary: 查询组织
      x-permissions: [organization:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: 组织列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization]
      operationId: createOrganization
      summary: 创建组织
      x-permissions: [organization:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationUpsert' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/factories:
    get:
      tags: [Organization]
      operationId: listFactories
      summary: 查询当前用户可访问工厂
      x-permissions: [factory:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: 工厂列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactoryPage' }
    post:
      tags: [Organization]
      operationId: createFactory
      summary: 创建工厂
      x-permissions: [factory:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactoryUpsert' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Factory' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/factories/{factoryId}:
    parameters:
      - $ref: '#/components/parameters/FactoryPathId'
    get:
      tags: [Organization]
      operationId: getFactory
      summary: 获取工厂详情
      x-permissions: [factory:read]
      responses:
        '200':
          description: 工厂详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Factory' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organization]
      operationId: updateFactory
      summary: 更新工厂
      x-permissions: [factory:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactoryPatch' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Factory' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/workshops:
    get:
      tags: [Organization]
      operationId: listWorkshops
      summary: 查询车间
      x-permissions: [workshop:read]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: 车间列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkshopPage' }
    post:
      tags: [Organization]
      operationId: createWorkshop
      summary: 创建车间
      x-permissions: [workshop:write]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkshopUpsert' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workshop' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/production-lines:
    get:
      tags: [Organization]
      operationId: listProductionLines
      summary: 查询生产线
      x-permissions: [line:read]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - $ref: '#/components/parameters/WorkshopIdQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: 生产线列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionLinePage' }
    post:
      tags: [Organization]
      operationId: createProductionLine
      summary: 创建生产线
      x-permissions: [line:write]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionLineUpsert' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionLine' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/users:
    get:
      tags: [Access Control]
      operationId: listWorkerAccounts
      summary: 查询员工账号绑定状态
      x-permissions: [user:read]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
      responses:
        '200':
          description: 员工账号列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerAccountPage' }
    post:
      tags: [Access Control]
      operationId: createWorkerAccount
      summary: 为员工创建固定最小权限账号
      x-permissions: [user:write]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerAccountCreate' }
      responses:
        '201':
          description: 创建并绑定成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerAccount' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/users/{userId}/status:
    patch:
      tags: [Access Control]
      operationId: setWorkerAccountStatus
      summary: 启用或停用员工账号
      x-permissions: [user:write]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerAccountStatusPatch' }
      responses:
        '200':
          description: 状态更新成功，已有会话已撤销
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerAccount' }
  /api/v1/users/{userId}/password:reset:
    post:
      tags: [Access Control]
      operationId: resetWorkerAccountPassword
      summary: 重置员工账号临时密码
      x-permissions: [user:write]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerAccountPasswordReset' }
      responses:
        '200':
          description: 密码已重置，已有会话已撤销
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerAccount' }
  /api/v1/users/{userId}/roles:
    put:
      tags: [Access Control]
      operationId: replaceUserRoles
      summary: 替换用户角色及工厂范围
      x-permissions: [role:assign]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items: { $ref: '#/components/schemas/RoleAssignment' }
      responses:
        '200':
          description: 分配成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleAssignment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/roles:
    get:
      tags: [Access Control]
      operationId: listRoles
      summary: 查询角色
      x-permissions: [role:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePage' }
    post:
      tags: [Access Control]
      operationId: createRole
      summary: 创建角色
      x-permissions: [role:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpsert' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workers:
    get:
      tags: [Workers]
      operationId: listWorkers
      summary: 查询工人
      x-permissions: [worker:read]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/WorkshopIdQuery'
        - $ref: '#/components/parameters/LineIdQuery'
        - name: processId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: 工人列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerPage' }
    post:
      tags: [Workers]
      operationId: createWorker
      summary: 创建工人
      x-permissions: [worker:write]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worker' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/workers/{workerId}:
    parameters:
      - $ref: '#/components/parameters/FactoryId'
      - $ref: '#/components/parameters/WorkerId'
    get:
      tags: [Workers]
      operationId: getWorker
      summary: 获取工人及技能
      x-permissions: [worker:read]
      responses:
        '200':
          description: 工人详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worker' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workers]
      operationId: updateWorker
      summary: 更新工人
      x-permissions: [worker:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerPatch' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worker' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workers/{workerId}/skills:
    parameters:
      - $ref: '#/components/parameters/FactoryId'
      - $ref: '#/components/parameters/WorkerId'
    get:
      tags: [Workers]
      operationId: listWorkerSkills
      summary: 查询工人掌握的工种
      x-permissions: [worker:read]
      responses:
        '200':
          description: 技能列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkerSkill' }
    put:
      tags: [Workers]
      operationId: replaceWorkerSkills
      summary: 替换工人技能集合
      description: 支持一个工人绑定多个工序；历史报工不受技能变更影响。
      x-permissions: [worker:skill:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skills]
              properties:
                skills:
                  type: array
                  minItems: 0
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/WorkerSkillInput' }
      responses:
        '200':
          description: 技能已更新
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkerSkill' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/master-data/{resource}:
    parameters:
      - $ref: '#/components/parameters/FactoryId'
      - $ref: '#/components/parameters/MasterResource'
    get:
      tags: [Master Data]
      operationId: listMasterData
      summary: 查询基础资料
      description: 统一查询客户、款式、颜色、尺码和工序。
      x-permissions: [master:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: 基础资料列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataPage' }
    post:
      tags: [Master Data]
      operationId: createMasterData
      summary: 创建基础资料
      x-permissions: [master:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MasterDataCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataItem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/master-data/{resource}/{resourceId}:
    parameters:
      - $ref: '#/components/parameters/FactoryId'
      - $ref: '#/components/parameters/MasterResource'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Master Data]
      operationId: getMasterData
      summary: 获取基础资料详情
      x-permissions: [master:read]
      responses:
        '200':
          description: 基础资料详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Master Data]
      operationId: updateMasterData
      summary: 更新基础资料
      x-permissions: [master:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MasterDataPatch' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterDataItem' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/processes/{processId}/adjust-rate:
    post:
      tags: [Master Data, Piecework]
      operationId: adjustProcessRate
      summary: 调整标准工序单价
      description: 更新工序默认价和未来路线；可选同步历史扎包。已完成报工保留原始金额，并生成正负计件差额记录。
      x-permissions: [piecework:adjust]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - name: processId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessRateAdjustmentRequest' }
      responses:
        '200':
          description: 工序单价已调整
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessRateAdjustmentResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/route-versions:
    get:
      tags: [Routes]
      operationId: listRouteVersions
      summary: 查询款式工艺路线版本
      x-permissions: [route:read]
      parameters:
        - $ref: '#/components/parameters/FactoryId'
        - name: styleId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: routeStatus
          in: query
          schema: { $ref: '#/components/schemas/RouteVersionStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 路线版本列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteVersionPage' }
    post:
