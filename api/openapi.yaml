        name: { type: string, minLength: 1, maxLength: 80 }
        userId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        pin: { type: [string, 'null'], minLength: 4, maxLength: 20, writeOnly: true }
        workshopId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        productionLineId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/WorkerStatus' }
        leftOn: { type: [string, 'null'], format: date }
    Worker:
      allOf:
        - type: object
          required: [id, factoryId, workerNo, name, status, skills]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            factoryId: { $ref: '#/components/schemas/Uuid' }
            userId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
            workerNo: { type: string }
            name: { type: string }
            workshopId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
            productionLineId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
            status: { $ref: '#/components/schemas/WorkerStatus' }
            hiredOn: { type: [string, 'null'], format: date }
            leftOn: { type: [string, 'null'], format: date }
            skills:
              type: array
              items: { $ref: '#/components/schemas/WorkerSkill' }
        - $ref: '#/components/schemas/AuditFields'
    WorkerPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Worker' } }
        page: { $ref: '#/components/schemas/PageInfo' }
