        format: { type: string, enum: [XLSX, CSV] }
        status: { $ref: '#/components/schemas/JobStatus' }
        rowCount: { type: [integer, 'null'], minimum: 0 }
        downloadUrl: { type: [string, 'null'], format: uri }
        downloadExpiresAt: { type: [string, 'null'], format: date-time }
