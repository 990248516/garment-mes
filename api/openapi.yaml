      scheme: bearer
      bearerFormat: JWT
      description: 短期访问令牌；账号停用、设备解绑和会话撤销应立即失效。
  parameters:
    FactoryId:
      name: X-Factory-Id
      in: header
      required: true
      description: 当前业务工厂。服务端必须校验其属于令牌允许的数据范围。
      schema: { $ref: '#/components/schemas/Uuid' }
    FactoryPathId:
      name: factoryId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID。相同键和请求体返回首次响应；相同键配不同请求体返回 409。
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 资源乐观锁版本，格式为带引号的整数 ETag，例如 `"3"`。
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1 }
      description: 上一页返回的不透明游标。
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Search:
      name: q
      in: query
      schema: { type: string, maxLength: 100 }
      description: 编码、名称或业务号模糊查询。
    Status:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/ActiveStatus' }
    WorkshopIdQuery:
      name: workshopId
      in: query
      schema: { $ref: '#/components/schemas/Uuid' }
    LineIdQuery:
      name: productionLineId
      in: query
      schema: { $ref: '#/components/schemas/Uuid' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    WorkerId:
      name: workerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MasterResource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [customers, styles, colors, sizes, processes]
    RouteVersionId:
      name: routeVersionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CuttingBedId:
      name: cuttingBedId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    BundleId:
      name: bundleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PrintJobId:
      name: printJobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    WorkReportId:
      name: workReportId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    QualityIssueId:
      name: qualityIssueId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PieceworkEntryId:
      name: pieceworkEntryId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
  headers:
    XRequestId:
      description: 服务端请求追踪 UUID。
      schema: { type: string, format: uuid }
    ETag:
      description: 当前资源版本，例如 `"3"`。
      schema: { type: string }
    IdempotencyReplayed:
      description: true 表示该响应来自已缓存的幂等结果。
      schema: { type: boolean }
    RetryAfter:
      description: 建议重试等待秒数。
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: 未登录、令牌过期或会话已撤销
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://mes.example.com/problems/unauthorized
            title: 身份验证失败
            status: 401
            code: UNAUTHORIZED
            requestId: 48e23aa2-629d-4cd7-92cb-021242c4a15f
            serverTime: '2026-08-29T11:00:00Z'
    Forbidden:
      description: 无操作权限或数据范围不允许
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 资源不存在；跨工厂资源也统一返回 404，避免信息泄露
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 状态冲突、乐观锁失败、唯一约束冲突或幂等键误用
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: 字段、数量守恒或业务校验失败
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://mes.example.com/problems/quantity-unbalanced
            title: 完工数量不平
            status: 422
            code: QUANTITY_UNBALANCED
            detail: 投入 10，良品、次品和短缺合计 9，还差 1 件。
            requestId: a99a99c1-89dd-4dac-b87d-77d8ea9d74d1
            serverTime: '2026-08-29T11:00:00Z'
            errors:
              - field: missingQty
                code: SUM_MISMATCH
                message: 请补录 1 件。
    TooManyRequests:
      description: 触发登录、扫码、短码或报工限流
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Uuid:
      type: string
      format: uuid
    Money:
      type: string
      pattern: '^-?[0-9]{1,10}(\.[0-9]{1,4})?$'
      examples: ['3.2000']
    NonNegativeMoney:
      type: string
      pattern: '^[0-9]{1,10}(\.[0-9]{1,4})?$'
      examples: ['0.8000']
    Quantity:
      type: integer
      minimum: 0
    PositiveQuantity:
      type: integer
      minimum: 1
    ActiveStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED, INACTIVE]
    WorkerStatus:
      type: string
      enum: [ACTIVE, INACTIVE, LEFT]
    RouteVersionStatus:
      type: string
      enum: [DRAFT, PUBLISHED, RETIRED]
    OrderStatus:
      type: string
      enum: [DRAFT, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    CuttingBedStatus:
      type: string
      enum: [DRAFT, CUTTING, CUT, RELEASED, CANCELLED]
    BundleStatus:
      type: string
      enum: [CREATED, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED, SPLIT, MERGED]
    BundleStepStatus:
      type: string
      enum: [PENDING, READY, STARTED, BLOCKED, COMPLETED, SKIPPED, CANCELLED]
    WorkReportStatus:
      type: string
      enum: [STARTED, COMPLETED, CANCELLED, REVERSED]
    QualityIssueStatus:
      type: string
      enum: [OPEN, IN_REVIEW, REWORK, RELEASED, SCRAPPED, CLOSED]
    QualitySeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    QualityActionType:
      type: string
      enum: [COMMENT, ASSIGN, REWORK, RELEASE, SCRAP, CLOSE, REOPEN]
    PieceworkStatus:
      type: string
      enum: [PENDING, CONFIRMED, SETTLED, REVERSED]
    PrintJobStatus:
      type: string
      enum: [PENDING, QUEUED, PRINTING, COMPLETED, PARTIAL_FAILED, FAILED, CANCELLED]
    JobStatus:
      type: string
      enum: [PENDING, VALIDATING, READY, RUNNING, COMPLETED, FAILED, CANCELLED]
    AlertType:
      type: string
      enum: [ORDER_OVERDUE, STEP_STALLED, QUANTITY_MISMATCH, STEP_SKIPPED, DUPLICATE_REPRINT, BUNDLE_BLOCKED]
    AlertSeverity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    Problem:
      type: object
      required: [type, title, status, code, requestId, serverTime]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          description: 稳定的机器可读错误码。
          examples: [QUANTITY_UNBALANCED]
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        requestId: { type: string, format: uuid }
        serverTime: { type: string, format: date-time }
        retryable: { type: boolean, default: false }
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
              rejectedValue: {}
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        total:
          type: [integer, 'null']
          minimum: 0
          description: 仅在查询成本可接受时返回。
    AuditFields:
      type: object
      required: [createdAt, updatedAt]
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        updatedBy: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        version: { type: integer, minimum: 1 }
    LoginRequest:
      type: object
      required: [account, secret]
      properties:
        account: { type: string, minLength: 1, maxLength: 80 }
        secret: { type: string, minLength: 4, maxLength: 200, writeOnly: true }
        organizationCode: { type: string, maxLength: 40 }
        deviceId: { type: string, maxLength: 100 }
        deviceName: { type: string, maxLength: 100 }
    AuthSession:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType, user, serverTime]
      properties:
        accessToken: { type: string, writeOnly: true }
        refreshToken: { type: string, writeOnly: true }
        expiresIn: { type: integer, minimum: 60 }
        tokenType: { type: string, const: Bearer }
        user: { $ref: '#/components/schemas/CurrentUser' }
        serverTime: { type: string, format: date-time }
    CurrentUser:
      type: object
      required: [id, organizationId, username, displayName, roles, permissions, factories]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        organizationId: { $ref: '#/components/schemas/Uuid' }
        username: { type: string }
        displayName: { type: string }
        workerId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        factories:
          type: array
          items: { $ref: '#/components/schemas/FactoryScope' }
    FactoryScope:
      type: object
      required: [factoryId, factoryName, dataScopes]
      properties:
        factoryId: { $ref: '#/components/schemas/Uuid' }
        factoryName: { type: string }
        dataScopes:
          type: array
          items:
            type: string
            enum: [ALL, FACTORY, WORKSHOP, LINE, SELF]
        workshopIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        productionLineIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    OrganizationUpsert:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { $ref: '#/components/schemas/ActiveStatus' }
    Organization:
      allOf:
        - type: object
          required: [id, code, name, status]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            code: { type: string }
            name: { type: string }
            status: { $ref: '#/components/schemas/ActiveStatus' }
        - $ref: '#/components/schemas/AuditFields'
    OrganizationPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    FactoryUpsert:
