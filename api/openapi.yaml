      summary: 通过短码或扎包号解析扎包
      description: 短码查询需登录并按用户、设备和 IP 限流；跨工厂统一返回 404。
      x-permissions: [bundle:scan]
      x-rate-limit: 30/minute/user+device+IP
      parameters:
        - $ref: '#/components/parameters/FactoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 4, maxLength: 80 }
                deviceId: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 已解析
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BundleScanView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: 扎包或二维码已作废
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
